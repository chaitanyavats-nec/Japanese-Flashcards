<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Japanese Flashcards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Noto+Sans+Japanese:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Home Screen -->
  <div id="home-screen">
    <div class="home-header">
      <h1>Collections</h1>
      <div class="header-actions">
        <label class="setting-toggle">
          <input type="checkbox" id="toggle-kanji">
          <span>Kanji</span>
        </label>
        <p class="streak-indicator">🔥 1 Day Streak</p>
      </div>
    </div>
    <div id="collections-list" class="collections-grid">
      <!-- Generated by JS -->
    </div>
  </div>

  <!-- Progress bar -->
  <div id="progress-bar-track" hidden>
    <div id="progress-bar-fill"></div>
  </div>
  <div id="arena-header" hidden>
    <button id="btn-back-home" aria-label="Back to collections">← Back</button>
    <p id="progress-label">Loading...</p>
    <label class="setting-toggle">
      <input type="checkbox" id="toggle-kanji-arena">
      <span>Kanji</span>
    </label>
  </div>

  <!-- Card arena — the swipeable area -->
  <div id="card-arena" hidden>
    <div id="card" tabindex="0" role="button" aria-label="Flashcard">
      
      <!-- Card inner wrapper — this is what rotates on flip -->
      <div id="card-inner">

        <!-- FRONT FACE -->
        <div class="card-face" id="card-front">
          <div class="card-topbar">
            <span id="card-counter" class="muted"></span>
          </div>
          <div class="card-body">
            <div class="card-image-container">
               <img class="card-image" src="" alt="" />
               <div class="image-credit muted"></div>
            </div>
            <div class="word-group">
               <p class="kanji-word"></p>
               <p class="hiragana-word muted"></p>
               <p class="romaji-word-front muted"></p>
            </div>
            <button class="btn-audio" aria-label="Play pronunciation">🔊</button>
            <p class="tap-hint muted">Tap to reveal</p>
          </div>
        </div>

        <!-- BACK FACE -->
        <div class="card-face" id="card-back">
          <div class="card-topbar">
            <span class="card-counter-back muted"></span>
          </div>
          <div class="card-scrollable">
            <div class="kanji-vg-container"></div>
            <div class="back-word-group">
               <p class="japanese-word-back"></p>
               <p class="romaji-word"></p>
               <p class="katakana-word muted"></p>
               <p class="meaning"></p>
               <span class="pos-pill muted"></span>
            </div>
            
            <div class="grammar-section">
               <!-- Populated with conjugations or particles -->
            </div>
            
            <div class="sentence-section">
              <hr class="section-divider">
              <p class="sentence-japanese"></p>
              <p class="sentence-romaji muted"></p>
              <p class="sentence-english muted"></p>
            </div>

            <div class="action-buttons">
              <button class="btn-dont-know" aria-label="I don't know this word">✗ Don't know</button>
              <button class="btn-know" aria-label="I know this word">Know it ✓</button>
            </div>
          </div>
        </div>

      </div>

      <!-- Swipe overlay labels (hidden until drag) -->
      <div class="swipe-label swipe-know">Know it ✓</div>
      <div class="swipe-label swipe-dont">✗ Don't know</div>
    </div>
  </div>

  <!-- Session complete actions -->
  <div id="summary" hidden>
    <h2>Session Complete!</h2>
    <div class="summary-stats">
      <span id="known-count">0 ✓</span>
      <span id="unknown-count">0 ✗</span>
    </div>
    <div id="missed-thumbnails"></div>
    <button id="btn-review-missed" class="icon-text-btn" aria-label="Review missed cards">
      Review Missed
    </button>
    <button id="btn-new-session" class="icon-text-btn" aria-label="Start new session">
      New Session
    </button>
    <button id="btn-summary-home" class="icon-text-btn outline-btn" aria-label="Back to Home">
      Back to Home
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
