<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nihongo — Japanese Flashcards</title>
  <!-- Favicons & App Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nihongo">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Home Screen -->
  <div id="home-screen">
    <div class="home-header">
      <div class="brand">
        <span class="brand-mark">日</span>
        <div class="brand-text">
          <h1>Learning Path</h1>
          <p class="brand-subtitle">Progress through Japanese, one level at a time</p>
        </div>
      </div>
      <div class="header-actions">
        <label class="setting-toggle">
          <input type="checkbox" id="toggle-kanji">
          <span>Kanji</span>
        </label>
        <p class="streak-indicator">🔥 1 Day Streak</p>
      </div>
    </div>
    <div id="collections-list" class="collections-grid">
      <!-- Generated by JS -->
    </div>
  </div>

  <!-- Progress bar -->
  <div id="progress-bar-track" hidden>
    <div id="progress-bar-fill"></div>
  </div>
  <div id="arena-header" hidden>
    <button id="btn-back-home" aria-label="Back to collections">← Back</button>
    <p id="progress-label">Loading...</p>
    <label class="setting-toggle">
      <input type="checkbox" id="toggle-kanji-arena">
      <span>Kanji</span>
    </label>
  </div>

  <!-- Card arena — the swipeable area -->
  <div id="card-arena" hidden>
    <div id="card" tabindex="0" role="button" aria-label="Flashcard">

      <!-- Card inner wrapper — this is what rotates on flip -->
      <div id="card-inner">

        <!-- FRONT FACE -->
        <div class="card-face" id="card-front">
          <div class="card-topbar">
            <span id="card-tag" class="tag-chip"></span>
            <span id="card-counter" class="muted"></span>
          </div>
          <div class="card-body">
            <div class="word-group">
               <p class="kanji-word"></p>
               <p class="hiragana-word muted"></p>
               <p class="romaji-word-front muted"></p>
            </div>
            <button class="btn-audio" aria-label="Play pronunciation">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 8 8 8 12 4 12 20 8 16 4 16 4 8"></polygon><path d="M16 8.5a4.5 4.5 0 0 1 0 7"></path><path d="M18.5 6a8 8 0 0 1 0 12"></path></svg>
            </button>
            <p class="tap-hint muted">Tap to reveal</p>
          </div>
        </div>

        <!-- BACK FACE -->
        <div class="card-face" id="card-back">
          <div class="card-scrollable">
            <div class="card-topbar">
              <span class="card-counter-back muted"></span>
            </div>
            <div class="back-word-group">
               <p class="japanese-word-back"></p>
               <p class="romaji-word"></p>
               <p class="katakana-word muted"></p>
               <p class="meaning"></p>
               <span class="pos-pill muted"></span>
            </div>

            <button class="stroke-toggle" hidden>
              <span>Show stroke order</span>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div class="kanji-vg-container" hidden></div>

            <div class="breakdown-section"></div>

            <div class="grammar-section">
               <!-- Populated with conjugations -->
            </div>

            <div class="particle-section"></div>

            <div class="sentence-section">
              <div class="sentence-card">
                <p class="sentence-japanese"></p>
                <p class="sentence-romaji muted"></p>
                <div class="sentence-divider"></div>
                <p class="sentence-english"></p>
              </div>
            </div>
            <div class="scroll-spacer"></div>
          </div>
          <div class="scroll-fade"></div>

          <div class="action-buttons">
            <button class="btn-dont-know" aria-label="I don't know this word">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              Don't know
            </button>
            <button class="btn-know" aria-label="I know this word">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              Know it
            </button>
          </div>
        </div>

      </div>

      <!-- Swipe overlay labels (hidden until drag) -->
      <div class="swipe-label swipe-know">Know it ✓</div>
      <div class="swipe-label swipe-dont">✗ Don't know</div>
    </div>
  </div>

  <!-- Session complete actions -->
  <div id="summary" hidden>
    <div class="summary-badge">🎉</div>
    <h2>Session Complete!</h2>
    <div class="summary-stats">
      <span id="known-count">0 ✓</span>
      <span id="unknown-count">0 ✗</span>
    </div>
    <div id="missed-thumbnails"></div>
    <button id="btn-review-missed" class="icon-text-btn" aria-label="Review missed cards">
      Review Missed
    </button>
    <button id="btn-new-session" class="icon-text-btn" aria-label="Start new session">
      New Session
    </button>
    <button id="btn-summary-home" class="icon-text-btn outline-btn" aria-label="Back to Home">
      Back to Home
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
